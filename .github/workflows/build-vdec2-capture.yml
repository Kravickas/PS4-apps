name: build-vdec2-capture

# Builds vdec2_capture for PS4 using the OpenOrbis toolchain.
# Trigger: push to any branch that touches the homebrew, or run manually
# from the Actions tab via "Run workflow".
#
# Output artifacts (downloadable from the run page):
#   - vdec2_capture-eboot      : the eboot.bin that needs to be wrapped in a .pkg
#   - vdec2_capture-elf        : the un-signed ELF for inspection / debugging
#
# After download, wrap eboot.bin into a homebrew .pkg with whatever PKG tool
# you prefer (PkgTool.Core, FPKG creator, etc.) and install on the PS4.

on:
  push:
    paths:
      - 'vdec2_capture.cpp'
      - 'Makefile'
      - '.github/workflows/build-vdec2-capture.yml'
  pull_request:
    paths:
      - 'vdec2_capture.cpp'
      - 'Makefile'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # OpenOrbis SDK release tag and matching LLVM-version asset.
      # ubuntu-24.04 ships clang-18 so we pull the LLVM-18 toolchain build.
      OO_TAG: v0.5.3
      OO_ASSET: toolchain-llvm-18.2.zip
      OO_PS4_TOOLCHAIN: ${{ github.workspace }}/.toolchain

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld make curl ca-certificates unzip

      - name: Cache OpenOrbis toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.OO_PS4_TOOLCHAIN }}
          key: openorbis-${{ env.OO_TAG }}-${{ env.OO_ASSET }}

      - name: Download OpenOrbis toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p "$OO_PS4_TOOLCHAIN" /tmp/oo-extract
          URL="https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/${OO_TAG}/${OO_ASSET}"
          echo "Downloading $URL"
          curl -fsSL "$URL" -o /tmp/oo.zip
          ls -la /tmp/oo.zip
          unzip -q /tmp/oo.zip -d /tmp/oo-extract
          echo "Extracted layout:"
          ls /tmp/oo-extract
          # The zip may contain a top-level dir like "OpenOrbis/PS4Toolchain"
          # or extract directly. Find the directory that contains link.x and
          # use it as the toolchain root.
          ROOT=$(dirname "$(find /tmp/oo-extract -name link.x | head -1)")
          if [ -z "$ROOT" ] || [ "$ROOT" = "." ]; then
            echo "ERROR: cannot locate link.x in extracted toolchain"
            find /tmp/oo-extract -maxdepth 4 | head -40
            exit 1
          fi
          echo "Toolchain root: $ROOT"
          # Move contents into the OO_PS4_TOOLCHAIN directory (note the
          # trailing /. to copy hidden + named entries)
          cp -a "$ROOT"/. "$OO_PS4_TOOLCHAIN"/
          chmod +x "$OO_PS4_TOOLCHAIN/bin/linux/"* 2>/dev/null || true
          rm -rf /tmp/oo.zip /tmp/oo-extract

      - name: Verify toolchain layout
        run: |
          echo "Toolchain root:"
          ls "$OO_PS4_TOOLCHAIN"
          echo
          echo "Linux tools:"
          ls "$OO_PS4_TOOLCHAIN/bin/linux"
          echo
          echo "Linker script present:"
          test -f "$OO_PS4_TOOLCHAIN/link.x" && echo "  link.x OK"
          echo
          echo "libSceVideodec2 stub:"
          ls "$OO_PS4_TOOLCHAIN/lib/" | grep -i videodec || echo "  (not found, will use runtime resolve)"

      - name: Build
        run: |
          make clean
          make V=1

      - name: Show build output
        run: ls -la build/

      - name: Upload eboot.bin
        uses: actions/upload-artifact@v4
        with:
          name: vdec2_capture-eboot
          path: build/eboot.bin
          if-no-files-found: error

      - name: Upload ELF (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: vdec2_capture-elf
          path: build/vdec2_capture.elf
          if-no-files-found: warn
