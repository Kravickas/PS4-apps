name: build-vdec2-capture

# Builds vdec2_capture for PS4 and produces an installable .pkg.
#
# Output artifact: IV0000-SHAD00001_00-VDEC2CAPTURE0000.pkg
# Install on a jailbroken PS4 via Remote PKG Installer.

on:
  push:
    paths:
      - 'vdec2_capture.cpp'
      - 'Makefile'
      - '.github/workflows/build-vdec2-capture.yml'
  pull_request:
    paths:
      - 'vdec2_capture.cpp'
      - 'Makefile'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The toolchain-action runs everything inside its own ubuntu:20.04
      # docker container with OpenOrbis SDK extracted to /lib/OpenOrbisSDK
      # and bin/linux/ added to PATH. v0.5.2 is the latest OpenOrbis release
      # that ships the legacy `${tag}.tar.gz` asset that the action's
      # entrypoint script expects (v0.5.3 broke this by switching to
      # toolchain-llvm-*.zip).
      - name: Build .pkg
        uses: Al-Azif/toolchain-action@main
        with:
          version: v0.5.2
          command: |
            set -e
            # Probe libSceVideodec2 stub presence
            if ls "$OO_PS4_TOOLCHAIN/lib/" 2>/dev/null | grep -iq videodec2; then
              VDEC2_STUB=present
            else
              VDEC2_STUB=absent
            fi
            echo "VDEC2_STUB=$VDEC2_STUB"
            apt-get update -qq && apt-get install -y -qq python3
            make VDEC2_STUB=$VDEC2_STUB

      - name: Show build output
        run: |
          ls -la
          echo "---"
          ls -la sce_sys/ 2>/dev/null || true

      - name: Upload .pkg
        uses: actions/upload-artifact@v4
        with:
          name: vdec2_capture-pkg
          path: '*.pkg'
          if-no-files-found: error
