name: build-vdec2-capture

# Builds vdec2_capture for PS4 and produces an installable .pkg.
#
# Output artifact: IV0000-SHAD00001_00-VDEC2CAPTURE0000.pkg
# Install on a jailbroken PS4 via Remote PKG Installer.
#
# Trigger: push touching the homebrew, or run manually from Actions tab.

on:
  push:
    paths:
      - 'vdec2_capture.cpp'
      - 'Makefile'
      - '.github/workflows/build-vdec2-capture.yml'
  pull_request:
    paths:
      - 'vdec2_capture.cpp'
      - 'Makefile'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .pkg via OpenOrbis toolchain
        uses: OpenOrbis/toolchain-action@main
        with:
          version: latest
          # The toolchain-action puts the toolchain at $OO_PS4_TOOLCHAIN and
          # adds bin/linux/ (which contains PkgTool.Core, create-gp4,
          # create-fself, clang++, ld.lld) to PATH. The action runs the
          # command in a Linux container so all paths are resolved correctly.
          #
          # We probe for the libSceVideodec2 stub before the build so the
          # Makefile knows whether to add `-lSceVideodec2` or fall back to
          # `--unresolved-symbols=ignore-all`.
          command: |
            if ls "$OO_PS4_TOOLCHAIN/lib/" | grep -iq videodec2; then
              VDEC2_STUB=present
            else
              VDEC2_STUB=absent
            fi
            echo "VDEC2_STUB=$VDEC2_STUB"
            make VDEC2_STUB=$VDEC2_STUB V=1

      - name: List build artifacts
        run: |
          echo "==== Working dir ===="
          ls -la
          echo
          echo "==== sce_sys ===="
          ls -la sce_sys/ 2>/dev/null || echo "(missing)"
          echo
          echo "==== build ===="
          ls -la build/ 2>/dev/null || echo "(missing)"

      - name: Upload .pkg
        uses: actions/upload-artifact@v4
        with:
          name: vdec2_capture-pkg
          path: '*.pkg'
          if-no-files-found: error

      - name: Upload .gp4 + sce_sys (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: vdec2_capture-pkg-sources
          path: |
            pkg.gp4
            sce_sys/
            eboot.bin
          if-no-files-found: warn
