name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Pinned (2026-11): ubuntu-latest is moving to Ubuntu 26.04, and PkgTool.Core stopped with
    # "Couldn't find a valid ICU package". The steps below are verified on 24.04 with ICU 74.2.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make curl libicu-dev clang lld

      - name: Install libssl1.1 (PkgTool.Core is .NET Core 3.1 and needs libssl1.1)
        run: |
          base="http://security.ubuntu.com/ubuntu/pool/main/o/openssl/"
          ver="$(curl -s "$base" \
            | grep -oE 'libssl1\.1_1\.1\.1f-[0-9a-z.~+]+_amd64\.deb' \
            | sed -E 's/^libssl1\.1_(.*)_amd64\.deb$/\1/' \
            | sort -V | tail -1)"
          echo "libssl1.1 version: $ver"
          curl -sSL -o libssl1.1.deb "${base}libssl1.1_${ver}_amd64.deb"
          sudo dpkg -i libssl1.1.deb || sudo apt-get install -f -y

      - name: Point PkgTool.Core at the installed ICU
        # PkgTool.Core is .NET Core 3.1, which does not look for an ICU as new as the one installed
        # and then stops. CLR_ICU_VERSION_OVERRIDE names the version to load. Running without ICU
        # (DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1) also builds, but pkg_build then orders the
        # files of a folder by byte value: sce_module/libSceFios2.prx before libc.prx, another
        # file system image than every package built so far (with ICU: libc.prx first).
        run: |
          lib="$(ls /usr/lib/x86_64-linux-gnu/libicuuc.so.*.* | sort -V | tail -1)"
          ver="${lib##*.so.}"
          echo "ICU library: $lib -> CLR_ICU_VERSION_OVERRIDE=$ver"
          test -n "$ver"
          echo "CLR_ICU_VERSION_OVERRIDE=$ver" >> "$GITHUB_ENV"

      - name: Download OpenOrbis toolchain (v0.5.4, LLVM 18)
        run: |
          curl -sSL \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o oo.tar.gz
          mkdir -p "$HOME/oo"
          tar -xzf oo.tar.gz -C "$HOME/oo"
          # locate the toolchain root (the dir that contains link.x)
          OO_ROOT="$(dirname "$(find "$HOME/oo" -name link.x | head -1)")"
          echo "OO_PS4_TOOLCHAIN=$OO_ROOT" >> "$GITHUB_ENV"
          echo "toolchain root: $OO_ROOT"

      - name: Stage right.sprx (from toolchain) if present
        run: |
          mkdir -p sce_sys/about
          RS="$(find "$OO_PS4_TOOLCHAIN" -name right.sprx | head -1)"
          if [ -n "$RS" ]; then cp "$RS" sce_sys/about/right.sprx; echo "copied $RS"; else echo "right.sprx not found in toolchain"; fi

      - name: Build
        run: |
          # prefer the toolchain's bundled clang/lld; fall back to system
          CLANG="$(find "$OO_PS4_TOOLCHAIN" -type f -name clang | head -1)"
          CLANGXX="$(find "$OO_PS4_TOOLCHAIN" -type f -name 'clang++' | head -1)"
          LLD="$(find "$OO_PS4_TOOLCHAIN" -type f -name 'ld.lld' | head -1)"
          TOOLS="CC=${CLANG:-clang} CXX=${CLANGXX:-clang++} LD=${LLD:-ld.lld}"
          # the main package (SDK 1.00-5.00), then one package per SDK version from 10.00
          # (src/sdk_chain10.h): their modules differ. make clean removes *.pkg, so each is kept aside
          make $TOOLS
          mkdir -p out && mv *.pkg out/
          for v in $(grep -oE '0x[0-9A-F]{8}' src/sdk_chain10.h); do
            make clean
            make $TOOLS SDK10=1 SDK=$v
            mv *.pkg out/
          done
          ls out

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: dmemtest-packages
          path: out/*.pkg
          if-no-files-found: error
          retention-days: 30
